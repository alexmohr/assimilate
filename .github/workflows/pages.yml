name: Deploy website and docs to GitHub Pages
on:
  push:
    branches: [main]
    paths: [docs/**, website/**, mkdocs.yml, scripts/render_website.py, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      # The marketing pages from website/ at the root, the documentation
      # under /docs/ (same layout as scripts/build-website.sh).
      - name: Build website and docs
        run: |
          python3 scripts/render_website.py website website_html
          mkdocs build --strict --site-dir website_html/docs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website_html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

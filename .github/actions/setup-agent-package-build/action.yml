name: Set up a standalone agent package build
description: >-
  Computes the agent version (exported as VERSION), and installs Python and the pinned stable Rust toolchain, for the jobs of build-agent.yml that package the agent with borg for Windows and macOS. Run it after checking out the repository with fetch-depth 0; the caller's env must set RUST_STABLE_TOOLCHAIN.
inputs:
  version:
    description: Version to stamp into the agent. Leave empty to derive it from crates/agent/Cargo.toml and the commit history.
    required: false
    default: ""
  target:
    description: Extra Rust target to install, for a cross-compiled build.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Compute agent version
      id: crate-version
      if: inputs.version == ''
      uses: ./.github/actions/crate-version
      with:
        crate: agent
    - name: Resolve version
      shell: bash
      env:
        VERSION: ${{ inputs.version || steps.crate-version.outputs.version }}
      run: echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Rust stable
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
        target: ${{ inputs.target }}

name: Duplicate Code Check
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: write

jobs:
  duplication:
    name: Detect duplicate code
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout scripts from default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/jscpd
            .jscpd.json

      - name: Checkout PR head
        # Stays on v6: v7 refuses fork PR code under pull_request_target without allow-unsafe-pr-checkout.
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-src
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # Install jscpd from the default branch's lockfile, outside the PR tree and
      # with lifecycle scripts disabled. npm never runs with the PR checkout as
      # its working directory, so a PR cannot influence which packages or
      # registry are used (.npmrc, node_modules, ...).
      - name: Install jscpd (trusted, lockfile-pinned)
        working-directory: .github/jscpd
        run: npm ci --ignore-scripts

      - name: Run jscpd
        # The PR tree is only scanned as data: jscpd is executed directly from
        # the trusted install and uses the default branch's .jscpd.json. No
        # package manager runs inside pr-src. jscpd exits non-zero when it finds
        # duplicates - that's not a workflow failure here, analyze-duplication.js
        # decides pass/fail from the JSON report, filtered to this PR's changed
        # files. Extend the ignore list in .jscpd.json, no workflow change needed.
        working-directory: pr-src
        run: |
          node "$GITHUB_WORKSPACE/.github/jscpd/node_modules/jscpd/run-jscpd.js" . \
            --config "$GITHUB_WORKSPACE/.jscpd.json" \
            --reporters json \
            --output ../jscpd-report \
            --silent || true

      - name: Analyze duplication and update PR
        uses: actions/github-script@v9
        with:
          script: |
            const analyze = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/analyze-duplication.js`);
            await analyze({
              github,
              context,
              core,
              prNumber: context.payload.pull_request.number,
              headSha: context.payload.pull_request.head.sha,
              reportPath: `${process.env.GITHUB_WORKSPACE}/jscpd-report/jscpd-report.json`,
            });

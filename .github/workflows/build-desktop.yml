name: Build Desktop
on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to stamp into the app and its server and agent. Leave empty to derive it from crates/server/Cargo.toml and the commit history (see the crate-version action).
        type: string
        required: false
        default: ""
env:
  CARGO_TERM_COLOR: always
  # Pinned stable compiler for release builds. Reusable workflows don't
  # inherit the caller's env, so this mirrors RUST_STABLE_TOOLCHAIN in ci.yml;
  # see docs/contributing/development.md for every file carrying it.
  RUST_STABLE_TOOLCHAIN: "1.98"
  # Matches the tauri 2.12 crate desktop/Cargo.lock resolves.
  TAURI_CLI_VERSION: "2.12.3"
# Builds the desktop installers for every platform the app supports, checks
# that the server, agent and PostgreSQL inside each one start the whole stack
# (and, on Windows, that the bundled borg stops cleanly on cancel), and
# uploads each target's installers as a desktop-<target> artifact.
jobs:
  build:
    name: Desktop installer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 26.04. The installers also support Debian 13, whose
          # glibc is older; a step below checks the binaries don't need a
          # newer one. No AppImage: linuxdeploy rewrites the library paths of every binary
          # it finds, PostgreSQL's and borg's included, and can't resolve
          # PostgreSQL's own $ORIGIN-relative libraries.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            bundles: deb,rpm
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            bundles: deb,rpm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: dmg
          - target: aarch64-apple-darwin
            runner: macos-15
            bundles: dmg
          # Ships the marcpope/borg-windows build of borg, pinned for this
          # target alone (see desktop/bundle.toml).
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis
            exe: .exe
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    # Git Bash on Windows, so every platform runs the same scripts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: crate-version
        if: inputs.version == ''
        uses: ./.github/actions/crate-version
        with:
          crate: server
      - name: Resolve version
        env:
          VERSION: ${{ inputs.version || steps.crate-version.outputs.version }}
        run: echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PostgreSQL and borg come from the releases pinned in
      # desktop/bundle.toml: the script refuses a file whose SHA-256 differs,
      # and the GitHub build attestation of each file it marks `attested` is
      # checked here too.
      - name: Download and verify PostgreSQL and borg
        env:
          GH_TOKEN: ${{ github.token }}
        # macOS runners' bash is 3.2: no mapfile.
        run: |
          downloads="$RUNNER_TEMP/downloads.txt"
          python scripts/desktop_bundle.py fetch --target "$TARGET" > "$downloads"
          while read -r file repo; do
            gh attestation verify "$file" --repo "$repo"
          done < "$downloads"
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      # A page may show an image the capture job on main has not taken yet
      # (it is committed after the merge); stand-ins keep the strict build
      # passing, as in scripts/build-website.sh.
      - name: Build the docs
        run: |
          pip install -r docs/requirements.txt
          python scripts/screenshot_fingerprint.py --placeholders
          mkdocs build --strict
      # The server links OpenSSL (web push encryption). Linux and macOS
      # runners have it; on Windows it comes from vcpkg, linked statically so
      # the installer needs no OpenSSL DLLs.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static-md
          {
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT"
            echo "VCPKGRS_TRIPLET=x64-windows-static-md"
            echo "OPENSSL_STATIC=1"
          } >> "$GITHUB_ENV"
      # Release artifacts are built with the pinned stable compiler, never
      # nightly.
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          cache-workspaces: |
            .
            desktop
      - name: Build server and agent
        env:
          APP_VERSION_OVERRIDE: ${{ env.VERSION }}
        run: cargo "+${RUST_STABLE_TOOLCHAIN}" build --release --locked -p server -p agent
      - name: Stage the bundle
        run: >
          python scripts/desktop_bundle.py stage --target "$TARGET" --server "target/release/server$EXE" --agent "target/release/agent$EXE" --web frontend/dist --docs docs_html
      - name: Build the installers
        working-directory: desktop
        env:
          BUNDLES: ${{ matrix.bundles }}
          # Tauri's CLI runs plain `cargo build`; keep it on the pinned compiler.
          RUSTUP_TOOLCHAIN: ${{ env.RUST_STABLE_TOOLCHAIN }}
        run: |
          printf '{"version": "%s"}\n' "$VERSION" > "$RUNNER_TEMP/version.conf.json"
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --verbose --target "$TARGET" --bundles "$BUNDLES" \
            --config tauri.bundle.conf.json --config "$RUNNER_TEMP/version.conf.json"
      - name: Unpack the installed app for the smoke test
        timeout-minutes: 15
        run: |
          bundle="desktop/target/$TARGET/release/bundle"
          app="$RUNNER_TEMP/app"
          mkdir -p "$app"
          if [ "$RUNNER_OS" = Linux ]; then
            dpkg-deb -x "$bundle"/deb/*.deb "$app"
            # The .rpm carries the same files; check it lists the bundle.
            rpm -qlp "$bundle"/rpm/*.rpm | grep -q '/usr/lib/Assimilate/postgres/bin/initdb$'
            bin="$app/usr/bin"
            res="$app/usr/lib/Assimilate"
          elif [ "$RUNNER_OS" = Windows ]; then
            # The installer's files exactly as it lays them out under the
            # install directory. 7-Zip reads the NSIS archive without
            # running it: a silent install from the runner's shell never
            # returned, and the smoke test needs the layout, not the setup.
            installer=$(ls "$bundle"/nsis/*-setup.exe)
            7z x -y "-o$(cygpath -w "$app")" "$(cygpath -w "$installer")" -x'!$PLUGINSDIR' -x'!uninstall.exe'
            ls -R "$app" | head -50
            bin="$app"
            res="$app"
          else
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$bundle"/dmg/*.dmg
            cp -R "$RUNNER_TEMP/dmg/Assimilate.app" "$app/"
            # Spotlight may still be indexing the fresh mount ("Resource
            # busy"): retry, then force.
            for attempt in 1 2 3; do
              hdiutil detach "$RUNNER_TEMP/dmg" && break
              sleep 5
            done
            if [ -d "$RUNNER_TEMP/dmg/Assimilate.app" ]; then
              hdiutil detach -force "$RUNNER_TEMP/dmg"
            fi
            bin="$app/Assimilate.app/Contents/MacOS"
            res="$app/Assimilate.app/Contents/Resources"
          fi
          ls -l "$bin" "$res"
          "$res/borg/borg.exe" --version
          "$res/postgres/bin/postgres$EXE" --version
          test -f "$res/licenses/postgresql.txt"
          test -f "$res/licenses/borgbackup.txt"
          test -f "$res/web/index.html"
          test -f "$res/docs/index.html"
          # Native paths: on Windows the tests read them outside Git Bash.
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          {
            echo "ASSIMILATE_TEST_SERVER_BIN=$(native "$bin/assimilate-server$EXE")"
            echo "ASSIMILATE_TEST_AGENT_BIN=$(native "$bin/assimilate-agent$EXE")"
            echo "ASSIMILATE_TEST_PG_INSTALL_DIR=$(native "$res/postgres")"
            echo "BORG_BINARY=$(native "$res/borg/borg.exe")"
          } >> "$GITHUB_ENV"
      - name: Check the binaries run on Debian 13's glibc
        if: runner.os == 'Linux'
        run: python scripts/glibc_floor.py 2.41 "$RUNNER_TEMP"/app/usr/bin/*
      # The server, agent and PostgreSQL exactly as the installer ships them
      # bring the whole stack up: cluster, sign-in, agent connection.
      - name: Smoke-test the installed binaries
        timeout-minutes: 20
        run: >
          cargo "+${RUST_STABLE_TOOLCHAIN}" test --locked -p desktop-core --test desktop_runtime --test embedded_postgres -- --ignored --test-threads=1
      # Cancelling a backup on Windows: the installed borg answers Ctrl+C by
      # itself and releases its repository lock.
      - name: Cancel a backup with the installed borg (Windows)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        run: >
          cargo "+${RUST_STABLE_TOOLCHAIN}" test --locked -p agent --test windows_borg_cancel -- --ignored --test-threads=1
      - name: Collect the installers
        run: |
          bundle="desktop/target/$TARGET/release/bundle"
          mkdir -p dist
          for file in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/dmg/*.dmg "$bundle"/nsis/*-setup.exe; do
            [ -e "$file" ] || continue
            cp "$file" "dist/assimilate-desktop-${VERSION}-${TARGET}.${file##*.}"
          done
          ls -l dist
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

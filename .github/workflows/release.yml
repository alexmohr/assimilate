name: Release
on:
  push:
    tags: ["v*"]
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading "v" from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Dockerfile.server bundles prebuilt agent binaries from agents/, so they must
  # be built for every architecture before the server image.
  build-agent:
    name: Build Agent
    needs: [version]
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Release Docker Publish
    needs: [version, build-agent]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      server-version: ${{ needs.version.outputs.version }}
      agent-version: ${{ needs.version.outputs.version }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
        type=sha

  desktop:
    name: Build Desktop
    needs: [version]
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Attaches the desktop installers, a SHA256SUMS file and their build
  # provenance to the tag's GitHub release, creating the release if the tag
  # was pushed without one.
  desktop-release:
    name: Release desktop installers
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/assimilate-desktop-*
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

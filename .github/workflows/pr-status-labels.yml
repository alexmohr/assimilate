name: PR Status Labels & Merge Gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Fired by coverage-diff-check.yml once its "Coverage Diff Check" run is
  # actually on the commit. That stage publishes a few seconds after this
  # workflow's own sync job has already read the commit's check list (both
  # trigger on the same "workflow_run: CI completed" event and start
  # together, but the sync is two API calls while coverage-diff first has to
  # locate two CI runs and download two artifacts), so the sync reliably lost
  # the race, found the check missing, and published "PR Merge Gate" as
  # in_progress - "CI is green, but still waiting on: Coverage Diff Check".
  # Nothing re-ran the sync for that commit afterwards, so the gate stayed
  # stuck there indefinitely. See "Resolve PR number" below for why this is a
  # repository_dispatch rather than a workflow_run on that workflow.
  repository_dispatch:
    types: [precheck-complete]

permissions:
  # write (not just read): sync-pr-labels.js squash-merges a PR itself once
  # it computes `ready to merge` plus a genuine approval - both the merge
  # commit and the post-merge branch deletion need contents:write, not just
  # pull-requests:write. Safe on this pull_request_target trigger the same
  # way pull-requests:write already was: this workflow only ever checks out
  # trusted scripts from the default branch (sparse-checkout .github/scripts
  # below), never the PR's own untrusted code.
  contents: write
  pull-requests: write
  actions: read
  checks: write

jobs:
  sync-labels:
    name: Sync PR status labels
    runs-on: ubuntu-latest
    # labeled/unlabeled only matters for the claude-approved / claude-changes-requested
    # review-verdict labels (see sync-pr-labels.js) - otherwise every status
    # label this workflow itself adds/removes would re-trigger it. A
    # repository_dispatch clears both clauses as-is: its event_name isn't
    # workflow_run, and its `action` is the dispatch type (precheck-complete),
    # never labeled/unlabeled.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0] != null) && (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       contains(fromJSON('["claude-approved","claude-changes-requested"]'), github.event.label.name))
    steps:
      - name: Checkout scripts from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
      # The precheck-complete branch is why that trigger is a
      # repository_dispatch and not simply another `workflow_run` entry:
      # coverage-diff-check.yml is itself workflow_run-triggered, so its run
      # lives in the default branch's context - head_branch is `main`, head_sha
      # is main's sha, and `workflow_run.pull_requests` is empty. A workflow
      # chained off it would have no way back to the PR number (the CI branch
      # above works only because `github.event.workflow_run` there describes
      # the CI run, which does sit on the PR's own head branch). A dispatch
      # carries the PR number explicitly in its client_payload instead, the
      # same mechanism sync-pr-labels.js already uses to reach claude-review.yml.
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let number = null;
            if (context.eventName === "repository_dispatch") {
              number = context.payload.client_payload.pr_number ?? null;
            } else if (context.eventName === "workflow_run") {
              const prs = context.payload.workflow_run.pull_requests || [];
              if (prs.length > 0) number = prs[0].number;
            } else {
              number = context.payload.pull_request.number;
            }
            core.setOutput("number", number ?? "");
      - name: Sync labels
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-pr-labels.js`);
            // selfCheckNames excludes this exact job (still "in progress" -
            // it's the one calling this) from sync-pr-labels.js's own
            // ready-to-merge completeness check, so it isn't mistaken for a
            // stalled check.
            await sync({
              github,
              context,
              core,
              prNumber: Number("${{ steps.pr.outputs.number }}"),
              eventAction: context.payload.action,
              selfCheckNames: ["Sync PR status labels"],
              // Off unless explicitly turned on (Settings -> Secrets and
              // variables -> Actions -> Variables -> AUTO_MERGE_ENABLED =
              // "true") - see skills/review/SKILL.md's "Auto-merge" section.
              autoMergeEnabled: "${{ vars.AUTO_MERGE_ENABLED }}" === "true",
              // This is the one call site allowed to notify claude-review.yml
              // (see the comment on sync-pr-labels.js's dispatchOnNeedsReview
              // param) - this workflow only ever runs in response to a real,
              // externally-caused event (a push, a review, CI completing),
              // never from inside claude-review.yml's own job, so there's no
              // risk of a review job re-triggering itself via this dispatch.
              dispatchOnNeedsReview: true,
            });

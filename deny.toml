[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # Marvin Attack timing sidechannel in the `rsa` crate. No fixed release
    # exists yet. Pulled in transitively via web-push -> jwt-simple ->
    # superboring and via russh/ssh-key; neither exposes RSA decryption with
    # attacker-observable timing in this project (Ed25519 keys are used).
    # Remove once rsa publishes a fix and the parents update.
    "RUSTSEC-2023-0071",
    # Timing side channels in `crypto-bigint` 0.5, fixed only in 0.7.6 (which
    # is in use). 0.5.5 comes in through `elliptic-curve` 0.13, via
    # web-push-native -> jwt-simple 0.12 and p256 0.13, and via the server's
    # p256, which russh 0.61 keeps from 0.14. It is only used to sign VAPID
    # JWTs, encrypt push payloads and make the VAPID key pair. Tracked in
    # https://github.com/alexmohr/assimilate/issues/657; remove once
    # `cargo tree -i crypto-bigint@0.5.5` is empty.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CDLA-Permissive-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "PostgreSQL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# sqlx has no jiff support, so `query!` maps `TIMESTAMPTZ` columns to the
# workspace's own jiff-backed instant type.
[macros.type-overrides]
'TIMESTAMPTZ' = "shared::time::Timestamp"
'DATE' = "shared::time::Date"
'TIMESTAMPTZ[]' = "Vec<shared::time::Timestamp>"

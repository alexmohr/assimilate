# Third-party binaries the desktop installers ship, pinned by version and
# SHA-256. scripts/desktop_bundle.py downloads them for one target, refuses
# any file whose digest differs, and stages them under desktop/resources/.
# CI additionally checks the GitHub build attestation of every download
# marked `attested`.
#
# To move to a new release, change the version and asset names, then update
# every sha256 to the digest published with that release's assets.

# PostgreSQL builds from theseus-rs/postgresql-binaries, the project the
# postgresql_embedded crate (crates/desktop-core) is written for. Each archive
# holds bin/, lib/ and share/, and its dependencies' notices.
[postgresql]
version = "18.6.0"
# The 18.6.0 archives carry no GitHub build attestation, so they rest on the
# pinned digests alone. Set this once a release ships with one.
attested = false
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-{target}.tar.gz"

[postgresql.sha256]
x86_64-unknown-linux-gnu = "bb3d09f876b2383e25a8c9ce09e32d185a03656a23d074f5195542b1b1b3ca61"
aarch64-unknown-linux-gnu = "5d2b5e8be9e96bfc3d7f22090057a836ec36d5d092542d8d3b93cc145cf4ee13"
x86_64-apple-darwin = "f8918fbe747e0d79bda58ad8f8afcf23ac384b847ff3af18856f0825ba54b031"
aarch64-apple-darwin = "a257bcdb8aa3301a13d6a5bcec48f8c9517045b7cbae71e50788b2615539e95b"
x86_64-pc-windows-msvc = "7da44c2dbcda3b49688ea08ce8cf99cfe677adf565f53a9145bf9002c74db7d5"

# BorgBackup's own single-directory builds (borg-dir/borg.exe and its
# libraries), which start faster than the single-file builds because nothing
# is unpacked to a temporary directory on each call.
[borg]
version = "1.4.4"
# BorgBackup's release workflow attests every binary it builds.
attested = true
url = "https://github.com/borgbackup/borg/releases/download/{version}/{asset}"

[borg.assets.x86_64-unknown-linux-gnu]
name = "borg-linux-glibc235-x86_64-gh.tgz"
sha256 = "5b4d30fb96fbf17ad11457bd4cf1326f97552edac7ee24192fc5a8557a6ee7dc"

[borg.assets.aarch64-unknown-linux-gnu]
name = "borg-linux-glibc235-arm64-gh.tgz"
sha256 = "7055e7a036680ce257b13639ff3cca53d7ccb2fb1a9f8e0b24916693041be56c"

[borg.assets.x86_64-apple-darwin]
name = "borg-macos-15-x86_64-gh.tgz"
sha256 = "ef1336b939ec6b92b23c9f8ad142169fffa8d7a67c1336091dff02fb736b0b13"

[borg.assets.aarch64-apple-darwin]
name = "borg-macos-15-arm64-gh.tgz"
sha256 = "907d0aa3d92b544d1231c2dc31f167c97b6860716c17435185e35467191ca07f"

# Windows only: BorgBackup publishes no Windows binaries (its own Windows CI
# job is disabled, borgbackup/borg#8264), so this target alone ships the
# native Windows build of the marcpope/borg-windows fork of borg 1.4: a
# single-directory PyInstaller build (borg.exe and _internal/) at the root of
# the zip. It carries no build attestation, so it rests on the pinned digest,
# and moving to a new release means reviewing the fork's changes since this
# one. Its LICENSE is BorgBackup's, byte for byte (the borgbackup.txt notice).
[borg.assets.x86_64-pc-windows-msvc]
name = "borg-windows-1.4.5-win1.zip"
url = "https://github.com/marcpope/borg-windows/releases/download/v1.4.5-win1/borg-windows.zip"
sha256 = "2ca36e846e11da781485dc0c04e6acbbf685c60855539592737c1c95a324adcd"
attested = false

# License texts shipped next to the binaries above (resources/licenses/),
# pinned to the upstream commit they were read from. `component` names what
# each covers: the standalone Windows agent ships only borg's. PostgreSQL's
# dependencies' notices ship inside its archive (dependency-notices/).
[[notices]]
name = "postgresql.txt"
component = "postgresql"
url = "https://raw.githubusercontent.com/postgres/postgres/7787aec8ab000932a8704a988b175b39ff816f2f/COPYRIGHT"
sha256 = "3d6af92ff8a4c2cdf69afb1cf44edea727922f5cd0cf8b5f72b11cdecac8fdfd"

[[notices]]
name = "borgbackup.txt"
component = "borg"
url = "https://raw.githubusercontent.com/borgbackup/borg/083eaa04184f3b3e113ffcf6373e23c526407bab/LICENSE"
sha256 = "bb38ab85fbb40fa6298a62c202e19841165e7f5579b23866407ed17233fdcee6"

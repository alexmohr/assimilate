[package]
name = "agent"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agent binary that runs on backup machines and connects to the Assimilate server"
license = "Apache-2.0"
repository = "https://github.com/alexmohr/assimilate"
authors = ["Alexander Mohr"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
gethostname = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
rustls = { workspace = true }
glob-match = { workspace = true }
# Database dumps run inside their pods through the Kubernetes exec API.
kube = { workspace = true }
bollard = { workspace = true }
k8s-openapi = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
shared = { path = "../shared" }

# Hook commands run in their own process group, which is signalled as a
# whole on timeout, and database dumps reach borg through named pipes; there
# is no such thing outside Unix.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

# The Windows service (service.rs), and the named-pipe ACLs and console
# interrupt shared with the server.
[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }

# tests/windows_borg_cancel.rs gives itself a console.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

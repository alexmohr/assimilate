[package]
name = "domain-wasm-tz"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly bindings for the domain crate's timezone-aware schedule logic, loaded on demand by the Assimilate frontend"
license = "Apache-2.0"
repository = "https://github.com/alexmohr/assimilate"
authors = ["Alexander Mohr"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
domain = { path = "../domain", features = ["timezones"] }
# Must match the wasm-bindgen-cli version in scripts/build-wasm.sh exactly.
wasm-bindgen = "=0.2.129"

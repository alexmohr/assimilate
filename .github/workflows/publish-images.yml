name: Publish Docker Images
on:
  workflow_call:
    inputs:
      server-version:
        description: Version stamped into the server image (SERVER_VERSION build arg and OCI label).
        type: string
        required: true
      agent-version:
        description: Version stamped into the agent image (AGENT_VERSION build arg and OCI label).
        type: string
        required: true
      tags:
        description: >-
          docker/metadata-action tag rules. Each image is first pushed per platform with an -amd64/-arm64 suffix on every tag, then the suffixed pairs are combined into one multi-arch manifest per tag.
        type: string
        required: true
# Requires the caller to have run build-agent.yml in the same workflow run: the
# server image bundles its agent-<arch> artifacts.
jobs:
  publish:
    name: Publish ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: assimilate
            dockerfile: Dockerfile.server
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: assimilate
            dockerfile: Dockerfile.server
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: assimilate-agent
            dockerfile: Dockerfile.agent
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - image: assimilate-agent
            dockerfile: Dockerfile.agent
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Stage agent binaries
        if: matrix.dockerfile == 'Dockerfile.server'
        uses: ./.github/actions/stage-agent-binaries
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ inputs.tags }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ matrix.image == 'assimilate' && inputs.server-version || inputs.agent-version }}
          build-args: |
            SERVER_VERSION=${{ inputs.server-version }}
            AGENT_VERSION=${{ inputs.agent-version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          platforms: ${{ matrix.platform }}

  manifest:
    name: Multi-Arch Manifest (${{ matrix.image }})
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [assimilate, assimilate-agent]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ inputs.tags }}
          flavor: latest=false
      - name: Create and push manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done <<< "$TAGS"

name: Publish Demo Image
on:
  workflow_call:
    inputs:
      tags:
        description: docker/metadata-action tag rules for ghcr.io/<owner>/assimilate-demo.
        type: string
        required: true
# The image the "Open in GitHub Codespaces" live demo runs
# (.devcontainer/demo-codespace). Prebuilt so a codespace starts in a couple of
# minutes instead of compiling the server. amd64 only: codespaces run on amd64.
jobs:
  publish:
    name: Publish assimilate-demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/assimilate-demo
          tags: ${{ inputs.tags }}
          flavor: latest=false
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/demo/Dockerfile.demo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own scope: CI's demo-e2e cache holds the coverage build.
          cache-from: type=gha,scope=demo-release
          cache-to: type=gha,mode=max,scope=demo-release
          platforms: linux/amd64

name: Release
on:
  push:
    tags: ["v*"]
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading "v" from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Dockerfile.server bundles prebuilt agent binaries from agents/, so they must
  # be built for every architecture before the server image.
  build-agent:
    name: Build Agent
    needs: [version]
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Release Docker Publish
    needs: [version, build-agent]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      server-version: ${{ needs.version.outputs.version }}
      agent-version: ${{ needs.version.outputs.version }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
        type=sha

name: Build Agent
on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to stamp into the agent binary. Leave empty to derive it from crates/agent/Cargo.toml and the commit history (see the crate-version action).
        type: string
        required: false
        default: ""
env:
  # Pinned stable compiler for the release agent binaries. Reusable workflows
  # don't inherit the caller's env, so this mirrors RUST_STABLE_TOOLCHAIN in
  # ci.yml; see docs/contributing/development.md for every file carrying it.
  RUST_STABLE_TOOLCHAIN: "1.98"
# Builds the agent natively for every architecture Dockerfile.server bundles and
# uploads each binary as an agent-<arch> artifact for the stage-agent-binaries
# action, plus the standalone Windows agent package (agent-windows-x86_64).
jobs:
  build:
    name: Build Agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Pinned, not ubuntu-latest: Ubuntu 26.04's GCC 15 compiled ring's C
          # code with AVX2 and BMI2, and the agent died of SIGILL on CPUs
          # without them (Atom C3000, older Xeons, many VMs).
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute agent version
        id: crate-version
        if: inputs.version == ''
        uses: ./.github/actions/crate-version
        with:
          crate: agent
      # Release artifacts are built with the pinned stable compiler, never
      # nightly.
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Build agent
        env:
          APP_VERSION_OVERRIDE: ${{ inputs.version || steps.crate-version.outputs.version }}
          # C dependencies target the same baseline CPU as the Rust code, whatever
          # the runner's GCC defaults to. Code that uses newer instructions
          # checks for them at run time.
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64 -mtune=generic
        run: cargo "+${RUST_STABLE_TOOLCHAIN}" build --release --locked -p agent
      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: target/release/agent
          retention-days: 1
  # The standalone Windows agent: assimilate-agent.exe with the borg pinned
  # for Windows in desktop/bundle.toml, as one zip (see docs/agents.md). It
  # isn't bundled into the server image, which only deploys to Linux hosts.
  build-windows:
    name: Build Agent (x86_64 Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute agent version
        id: crate-version
        if: inputs.version == ''
        uses: ./.github/actions/crate-version
        with:
          crate: agent
      - name: Resolve version
        env:
          VERSION: ${{ inputs.version || steps.crate-version.outputs.version }}
        run: echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Build agent
        env:
          APP_VERSION_OVERRIDE: ${{ env.VERSION }}
        run: cargo "+${RUST_STABLE_TOOLCHAIN}" build --release --locked -p agent
      - name: Package the agent with borg
        run: >
          python scripts/desktop_bundle.py stage-agent --target "$TARGET" --agent target/release/agent.exe --out "dist/assimilate-agent-${VERSION}-${TARGET}.zip"
      - name: Smoke-test the package
        run: |
          unpacked="$RUNNER_TEMP/agent"
          python -m zipfile -e dist/*.zip "$unpacked"
          "$unpacked/assimilate-agent/assimilate-agent.exe" --version
          "$unpacked/assimilate-agent/borg/borg.exe" --version
          test -f "$unpacked/assimilate-agent/licenses/borgbackup.txt"
          echo "BORG_BINARY=$(cygpath -w "$unpacked/assimilate-agent/borg/borg.exe")" >> "$GITHUB_ENV"
      # The service the documented way: an administrator installs it, and the
      # Service Control Manager runs it as LocalSystem. Each must trust the
      # folder the other made, so this checks the started service got past
      # that, into its own log, and that the SCM restarts it after an exit,
      # before removing it again. Nothing listens on the server URL; the
      # agent keeps retrying it, so it stays running.
      - name: Install, start, restart and remove the agent service
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'agent\assimilate-agent\assimilate-agent.exe'
          $log = 'C:\ProgramData\Assimilate\agent\agent.log'
          $env:BORG_SERVER_URL = 'http://127.0.0.1:9'
          $env:BORG_AGENT_TOKEN = 'ci-smoke-test-token'
          $env:BORG_SERVER_KEY = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          & $exe service install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $started = $false
          foreach ($attempt in 1..30) {
            Start-Sleep -Seconds 1
            $running = (Get-Service assimilate-agent).Status -eq 'Running'
            if ($running -and (Test-Path $log) -and (Select-String -Path $log -Pattern 'service starting' -Quiet)) {
              $started = $true
              break
            }
          }
          # An exit the service didn't report as a stop, as for the
          # dashboard's "Restart agent", is restarted by the SCM after its
          # restart delay (10 s). Killing the process is such an exit.
          $restarted = $false
          if ($started) {
            $before = (Get-CimInstance Win32_Service -Filter "Name='assimilate-agent'").ProcessId
            Stop-Process -Id $before -Force
            foreach ($attempt in 1..60) {
              Start-Sleep -Seconds 1
              $service = Get-CimInstance Win32_Service -Filter "Name='assimilate-agent'"
              if ($service.State -eq 'Running' -and $service.ProcessId -ne 0 -and $service.ProcessId -ne $before) {
                $restarted = $true
                break
              }
            }
          }
          if (-not ($started -and $restarted)) {
            Get-Service assimilate-agent | Format-List
            if (Test-Path $log) { Get-Content $log }
            Get-ChildItem C:\Windows\SystemTemp, C:\Windows\Temp -Filter 'assimilate-agent-service-error-*' -ErrorAction SilentlyContinue | Get-Content
          }
          & $exe service uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not $started) { Write-Error 'the service never started and logged'; exit 1 }
          if (-not $restarted) { Write-Error 'the SCM did not restart the service after it exited'; exit 1 }
      # Cancelling a backup on Windows: the packaged borg answers the agent's
      # Ctrl+C by itself and releases its repository lock.
      - name: Cancel a backup with the packaged borg
        run: >
          cargo "+${RUST_STABLE_TOOLCHAIN}" test --release --locked -p agent --test windows_borg_cancel -- --ignored --test-threads=1
      - name: Upload the agent package
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

[package]
name = "domain-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly bindings exposing the domain crate to the Assimilate frontend"
license = "Apache-2.0"
repository = "https://github.com/alexmohr/assimilate"
authors = ["Alexander Mohr"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
domain = { path = "../domain" }
js-sys = "0.3"
serde_json = { workspace = true }
# Must match the wasm-bindgen-cli version in scripts/build-wasm.sh exactly.
wasm-bindgen = "=0.2.129"

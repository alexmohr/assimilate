name: Log in to GHCR
description: >-
  Sets up Docker Buildx and logs in to the GitHub Container Registry with the workflow's own token, for the jobs that push images there.
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

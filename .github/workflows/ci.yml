name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
  # Pinned stable compiler for release builds and coverage. Every job in this
  # file reads it from here; see docs/contributing/development.md for the
  # other files that carry the same pin.
  RUST_STABLE_TOOLCHAIN: "1.98"
jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    services:
      postgres: &postgres_service
        image: postgres:latest
        env:
          POSTGRES_DB: borg
          POSTGRES_USER: borg
          POSTGRES_PASSWORD: borg_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borg -d borg" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-nightly-db
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: >
          cargo +nightly-2026-08-21 fmt -- --config error_on_unformatted=true,error_on_line_overflow=true,format_strings=true,group_imports=StdExternalCrate,imports_granularity=Crate #magic___^_^___line
      - name: Clippy
        run: cargo +nightly-2026-08-21 clippy --workspace -- -D warnings
      - name: Install dylint toolchain
        run: |
          toolchain=$(grep '^channel' lints/no_string_control_flow/rust-toolchain | cut -d'"' -f2)
          rustup toolchain install "$toolchain" --profile minimal --component rustc-dev --component llvm-tools-preview
      - name: Install cargo-dylint
        run: cargo install cargo-dylint@6.0.1 dylint-link@6.0.1 --locked
      - name: Enforce no string-based control flow (dylint)
        run: RUSTFLAGS="-D no_string_control_flow" cargo dylint --all --workspace
      - name: Tests
        run: cargo test --workspace --lib --bins
      - name: Check sqlx offline cache is fresh
        run: cargo sqlx prepare --check --workspace
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
      - name: Check generated TypeScript files are in sync
        run: git diff --exit-code frontend/src/types/generated/
  frontend:
    name: Frontend (fmt + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Check formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm run test
        working-directory: frontend
      - name: Check for security vulnerabilities
        run: |
          ALLOWLIST=$(node -e "const a=require('./.npm-audit-allowlist.json').audit;console.log(a.join(','))")
          if [ -n "$ALLOWLIST" ]; then
            npm audit --audit-level=moderate --omit=dev || {
              FOUND=$(npm audit --json --omit=dev | node -e "
                const allowed='${ALLOWLIST}'.split(',').filter(Boolean);
                const data=require('fs').readFileSync('/dev/stdin','utf8');
                const json=JSON.parse(data);
                const vulns=Object.keys(json.vulnerabilities||{}).filter(v=>!allowed.includes(v));
                if(vulns.length){console.error('Unallowed vulnerabilities: '+vulns.join(', '));process.exit(1);}
              ")
            }
          else
            npm audit --audit-level=moderate --omit=dev
          fi
        working-directory: frontend
      - name: Check for deprecated packages
        run: |
          node -e "
            const lock = require('./package-lock.json');
            const allowlist = require('./.npm-audit-allowlist.json').deprecated;
            const deps = Object.entries(lock.packages || {})
              .filter(([k, v]) => v.deprecated && k !== '')
              .map(([k]) => k.replace('node_modules/', ''))
              .filter(k => !allowlist.includes(k));
            if (deps.length) {
              console.error('Deprecated packages found (not in allowlist):');
              deps.forEach(d => console.error('  - ' + d));
              process.exit(1);
            }
            console.log('No unallowed deprecated packages found.');
          "
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
  db-integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres: *postgres_service
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-nightly-db
      - name: Run database integration tests
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
        run: cargo +nightly-2026-08-21 test -p server --test db_queries
      - name: Run ignored integration tests
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
        run: cargo +nightly-2026-08-21 test -p server --test integration -- --ignored --test-threads=1
      - name: Run ignored library tests (require database)
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
        run: cargo +nightly-2026-08-21 test -p server --lib -- --ignored --test-threads=1
  nightly-tests:
    name: Nightly Tests (no coverage)
    runs-on: ubuntu-latest
    services:
      postgres: *postgres_service
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-nightly-db
      - name: Run tests (unit + integration) on nightly
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
        run: cargo +nightly-2026-08-21 test --workspace -- --test-threads=1
  docs:
    name: Documentation (mkdocs build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build docs (strict)
        run: mkdocs build --strict
  ci-scripts:
    name: CI Scripts (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step: these tests use node's built-in runner and require
      # only the scripts themselves, so `.github/scripts/` stays dependency
      # free. They pin the gates this repo's automation trusts - the
      # zero-tolerance aggregate coverage comparison, and auto-merge's refusal
      # to land a change to any of the rails unattended: not just `.github/`
      # but `lints/`, `frontend/eslint-rules/`, `scripts/`, every immediate
      # child of the repository root and of `frontend/`, any top-level
      # dot-directory, and `Cargo.toml` anywhere in the tree.
      - name: Run CI script tests
        run: node --test .github/scripts/__tests__/*.test.js
  deps-audit:
    name: Rust Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      postgres: *postgres_service
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features postgres
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply database migrations
        run: cargo sqlx migrate run --source crates/server/migrations
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
      - name: Generate Rust coverage
        env:
          DATABASE_URL: postgres://borg:borg_secret@localhost:5432/borg
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --include-ignored --test-threads=1
      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Merge coverage files
        run: |
          sed 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info > frontend-lcov-fixed.info
          cat lcov.info frontend-lcov-fixed.info > merged.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: merged.info
          retention-days: 1

  coveralls-finish:
    name: Coveralls Finish
    runs-on: ubuntu-latest
    needs: [coverage, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-coverage
      - uses: actions/download-artifact@v4
        with:
          name: e2e-coverage
          path: e2e
      - name: Merge and upload coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --add-tracefile merged.info \
            --add-tracefile e2e/merged-e2e.info \
            --output-file final.info \
            --ignore-errors inconsistent
      # Coveralls treats the GitHub Actions run ID as the build identifier and
      # rejects a second report once that build is "closed" - re-running this
      # exact workflow run (not pushing a new commit) always hits this, since
      # the run ID doesn't change between attempts. That's a rerun-tooling
      # limitation, not a real coverage problem (the local lcov data below is
      # what analyze-coverage-diff.js and the "Upload merged coverage
      # artifact" step below actually rely on) - continue-on-error keeps a
      # rerun from failing the whole job over the external dashboard report
      # alone.
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: final.info
          format: lcov
      # A PR's CI builds GitHub's test merge commit, whose first parent is the
      # `main` commit it merged onto. coverage-diff-check.yml compares against
      # `main`'s coverage for exactly that commit, so the comparison measures
      # this PR's change and nothing `main` did since (see
      # .github/scripts/lib/coverage-baseline.js). Read from the commit object
      # itself, which the shallow checkout has, rather than from the event
      # payload's base.sha, which is not guaranteed to be the merge's parent.
      - name: Record the commit this PR's coverage was measured on top of
        if: github.event_name == 'pull_request'
        run: git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1 > coverage-base.sha
      - name: Upload merged coverage artifact
        # Consumed by .github/scripts/analyze-coverage-diff.js to check new/changed
        # lines and detect aggregate coverage regressions on PRs. 14-day retention
        # so a main-branch baseline is available even if main goes quiet for a while.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-final
          path: |
            final.info
            coverage-base.sha
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend]
    env:
      COMPOSE_FILES: -f .devcontainer/demo/docker-compose.demo.yml -f .devcontainer/demo/docker-compose.coverage-override.yml
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust stable (for backend coverage processing)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npm run e2e:install
        working-directory: frontend
      - name: Build frontend with Istanbul instrumentation
        run: npm run build
        working-directory: frontend
        env:
          VITE_COVERAGE: "true"
      - name: Prepare coverage directories
        run: mkdir -p .coverage frontend/.nyc_output
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build demo image (GitHub Actions build cache)
        # Build a single image tagged as both :coverage and :local.
        # The coverage-override.yml points the demo service at :coverage
        # (instrumented server binary); all agent/placeholder services use
        # :local but only execute /app/agent, so they are unaffected by
        # whether the server binary is instrumented.
        # A second COVERAGE=false build would break the Docker layer-cache
        # chain at the ARG COVERAGE declaration, forcing a second full cargo
        # build for no gain.
        #
        # This must go through build-push-action rather than a plain
        # `docker buildx build` in a `run:` step: the type=gha cache backend
        # needs the runtime token and cache URL that the runner only exposes
        # to actions, so the `run:` variant silently neither imported nor
        # exported any cache and rebuilt everything from scratch on every run.
        #
        # Only pushes to main write the cache. Every PR run reads main's
        # entry - the expensive cooked-dependency layer is keyed on the
        # dependency graph, so it survives ordinary source changes - and
        # skipping the export on PRs saves both its upload time and the
        # repository's shared cache quota.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/demo/Dockerfile.demo
          build-args: |
            COVERAGE=true
          cache-from: type=gha,scope=demo-e2e
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=demo-e2e' || '' }}
          load: true
          tags: |
            assimilate-demo:coverage
            assimilate-demo:local
      - name: Start demo environment (with instrumented frontend)
        run: |
          docker compose $COMPOSE_FILES up -d
          echo "Waiting for demo seed to complete (up to 40 min)..."
          DEMO_READY=false
          for i in $(seq 1 480); do
            if docker compose $COMPOSE_FILES logs demo 2>&1 | grep -q "Demo ready:"; then
              echo "Demo is seeded and ready"
              DEMO_READY=true
              break
            fi
            CONTAINER_ID=$(docker compose $COMPOSE_FILES ps -qa demo 2>/dev/null | head -1)
            if [ -n "$CONTAINER_ID" ]; then
              STATE=$(docker inspect --format '{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
              if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
                echo "ERROR: Demo container stopped unexpectedly (state: $STATE)"
                docker logs "$CONTAINER_ID" --tail 100
                exit 1
              fi
            fi
            sleep 5
          done
          if [ "$DEMO_READY" != "true" ]; then
            echo "ERROR: Timed out waiting for demo to be ready"
            CONTAINER_ID=$(docker compose $COMPOSE_FILES ps -qa demo 2>/dev/null | head -1)
            [ -n "$CONTAINER_ID" ] && docker logs "$CONTAINER_ID" --tail 100
            exit 1
          fi
      - name: Run Playwright tests
        run: |
          set +e
          npm run e2e
          PW_EXIT=$?
          node -e "
            const fs = require('fs');
            const path = 'test-results.json';
            if (!fs.existsSync(path)) {
              console.error('ERROR: No test results found - Playwright likely crashed');
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (r.stats.flaky > 0) {
              console.error('ERROR: ' + r.stats.flaky + ' flaky test(s) - treated as failure');
              process.exit(1);
            }
            if (r.stats.unexpected > 0) {
              console.error('ERROR: ' + r.stats.unexpected + ' test(s) failed');
              process.exit(1);
            }
            console.log('All ' + r.stats.expected + ' tests passed.');
          "
          CHECK_EXIT=$?
          exit $(( PW_EXIT > CHECK_EXIT ? PW_EXIT : CHECK_EXIT ))
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          VITE_COVERAGE: "true"
      - name: Dump container logs on Playwright failure
        if: failure()
        run: |
          # The coverage-collection steps below stop and tear down every
          # container unconditionally, so a Playwright failure otherwise
          # leaves no record of what the demo/agent containers were doing at
          # the time - e.g. whether an agent's SSH server was ever reachable.
          for svc in demo web-server-01 db-server-01 media-store-01 old-webserver legacy-db-prod; do
            echo "=== docker compose logs $svc ==="
            docker compose $COMPOSE_FILES logs "$svc" --no-color --timestamps 2>&1 || echo "(no logs for $svc)"
          done
      - name: Generate frontend e2e coverage report
        run: npx nyc report --reporter=lcov --report-dir=coverage-e2e --temp-dir=.nyc_output
        working-directory: frontend
      - name: Wait for background operations to quiesce
        run: |
          # Repo syncs and notification deliveries are fire-and-forget background
          # tasks with variable, data-dependent duration (not a fixed timer like the
          # borg kill-escalation delay). Poll /api/health so they get a chance to
          # finish - and have their remaining code recorded as covered - before the
          # teardown below stops containers on a fixed timeout, instead of racing it.
          for i in $(seq 1 25); do
            STATUS=$(curl -s -m 2 http://localhost:8080/api/health || echo '{}')
            IN_FLIGHT=$(echo "$STATUS" | jq -r '.background_ops_in_flight // true')
            if [ "$IN_FLIGHT" = "false" ]; then
              echo "No background operations in flight."
              break
            fi
            echo "Background operations still in flight, waiting... ($i/25)"
            sleep 1
          done
      - name: Collect backend coverage from Docker
        run: |
          # Stop agents with --timeout 30 so LLVM atexit handlers can flush profraw files
          # before docker sends SIGKILL. Also drops WebSocket connections so the server
          # shuts down cleanly without waiting for open connections.
          docker compose $COMPOSE_FILES stop --timeout 30 \
            web-server-01 db-server-01 media-store-01 \
            old-webserver legacy-db-prod \
            2>/dev/null || true
          sleep 2
          # Stop the demo container with SIGTERM and up to 30s for graceful shutdown.
          # This sends SIGTERM to start-demo.sh (PID 1), whose trap forwards it to the
          # server subprocess. The server's shutdown_signal() catches it via tokio,
          # drains connections, calls tunnel_manager.shutdown(), and exits main() cleanly.
          # LLVM's atexit handlers then flush coverage data to the bind-mounted .coverage/
          # before the process exits. docker compose stop waits for the container to fully
          # stop (or times out after 30s and sends SIGKILL).
          docker compose $COMPOSE_FILES stop demo --timeout 30 2>/dev/null || true
          # Copy server binary from the stopped demo container for llvm-cov.
          DEMO_CONTAINER=$(docker compose $COMPOSE_FILES ps -qa demo 2>/dev/null | head -1)
          if [ -n "$DEMO_CONTAINER" ]; then
            docker cp "$DEMO_CONTAINER":/app/server .coverage/server 2>/dev/null || true
          else
            echo "Demo container not found, skipping server binary copy"
          fi
          # Copy agent binary from one of the stopped agent containers for llvm-cov.
          AGENT_CONTAINER=$(docker compose $COMPOSE_FILES ps -qa web-server-01 2>/dev/null | head -1)
          if [ -n "$AGENT_CONTAINER" ]; then
            docker cp "$AGENT_CONTAINER":/app/agent .coverage/agent 2>/dev/null || true
          else
            echo "Agent container not found, skipping agent binary copy"
          fi
          echo "=== Debug: Coverage directory contents ==="
          ls -la .coverage/ || echo "coverage directory empty"
      - name: Process backend coverage
        run: |
          set -x
          if [ ! -f .coverage/server.profraw ] || [ ! -f .coverage/server ] || [ ! -f .coverage/agent ]; then
            echo "ERROR: No backend coverage data found"
            echo "=== Debug: Coverage directory ==="
            ls -la .coverage/ 2>/dev/null || echo "no coverage directory"
            exit 1
          fi

          # Use the same Rust image that built the coverage-instrumented binary.
          # NOTE: sh -c script is SINGLE-QUOTED so $() and $VAR are evaluated
          # inside the container, not on the CI runner.
          docker run --rm \
            -v "$(pwd)/.coverage:/coverage" \
            "rust:${RUST_STABLE_TOOLCHAIN}" \
            sh -c '
              set -e
              rustup component add llvm-tools
              SYSROOT=$(rustc --print sysroot)
              LLVM_PROFDATA=$SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata
              LLVM_COV=$SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-cov
              echo "=== Profraw files found ==="
              find /coverage -name "*.profraw" | xargs ls -la
              echo "=== Running llvm-profdata merge ==="
              find /coverage -name "*.profraw" | xargs $LLVM_PROFDATA merge -sparse -o /coverage/docker.profdata 2>&1
              echo "=== Running llvm-cov export ==="
              $LLVM_COV export -format=lcov \
                /coverage/server \
                --object /coverage/agent \
                -instr-profile=/coverage/docker.profdata \
                --ignore-filename-regex="/usr/local/cargo|/usr/local/rustup" \
                > /coverage/backend-e2e-raw.info
            '

          WORKSPACE=$(pwd)
          sed "s|SF:/src/|SF:${WORKSPACE}/|g" .coverage/backend-e2e-raw.info > backend-e2e.info

          sudo apt-get update && sudo apt-get install -y lcov

          if [ -f frontend/coverage-e2e/lcov.info ]; then
            # nyc reports paths relative to frontend/ (SF:src/...), while the
            # unit coverage job prefixes them (SF:frontend/src/...). lcov only
            # merges records with identical paths, so without this every
            # frontend file was counted twice in the final report, and any
            # line e2e reaches only on some runs moved the aggregate even
            # when a unit test covers it every time.
            sed 's|^SF:src/|SF:frontend/src/|' frontend/coverage-e2e/lcov.info > frontend-e2e-fixed.info
            lcov --add-tracefile backend-e2e.info \
              --add-tracefile frontend-e2e-fixed.info \
              --output-file merged-e2e.info \
              --ignore-errors inconsistent
          else
            cp backend-e2e.info merged-e2e.info
          fi

          echo "Backend + frontend e2e coverage merged successfully"
      - name: Upload e2e coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: merged-e2e.info
          retention-days: 1
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose $COMPOSE_FILES down -v
  build-agent:
    name: Build Agent
    uses: ./.github/workflows/build-agent.yml
  docker:
    name: Docker Compose (build + start)
    runs-on: ubuntu-latest
    needs: [build-agent]
    env:
      ASSIMILATE_SECRET_KEY: ci_test_key_not_real
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage agent binaries
        uses: ./.github/actions/stage-agent-binaries
      - name: Build images
        run: docker compose build
      - name: Build agent image
        run: docker buildx build -f Dockerfile.agent .
      - name: Start services
        run: docker compose up -d postgres server
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              echo "Postgres healthy"
              break
            fi
            sleep 2
          done
      - name: Check server is running
        run: |
          sleep 5
          docker compose ps
          curl --retry 10 --retry-delay 2 --retry-all-errors -sf http://localhost:8080/ > /dev/null
          echo "Server responding OK"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
  nightly-version:
    name: Nightly Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.server.outputs.version }}
      agent: ${{ steps.agent.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute server version
        id: server
        uses: ./.github/actions/crate-version
        with:
          crate: server
      - name: Compute agent version
        id: agent
        uses: ./.github/actions/crate-version
        with:
          crate: agent
  nightly:
    name: Nightly Docker Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, frontend, docker, build-agent, nightly-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:

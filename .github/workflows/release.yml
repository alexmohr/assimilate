name: Release
on:
  push:
    tags: ["v*"]
env:
  REGISTRY: ghcr.io
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading "v" from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Dockerfile.server bundles prebuilt agent binaries from agents/ so the server
  # can deploy agents to remote hosts. Build them natively for every supported
  # architecture, mirroring the build-agent job in ci.yml.
  build-agent:
    name: Build Agent (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-21
      - name: Build agent
        env:
          APP_VERSION_OVERRIDE: ${{ needs.version.outputs.version }}
        run: cargo +nightly-2026-08-21 build --release -p agent
      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: target/release/agent
          retention-days: 1

  release:
    name: Build & Push ${{ matrix.image }} (${{ matrix.platform }})
    needs: [version, build-agent]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: assimilate
            dockerfile: Dockerfile.server
            runner: ubuntu-latest
            platform: linux/amd64
          - image: assimilate
            dockerfile: Dockerfile.server
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: assimilate-agent
            dockerfile: Dockerfile.agent
            runner: ubuntu-latest
            platform: linux/amd64
          - image: assimilate-agent
            dockerfile: Dockerfile.agent
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download agent-x86_64
        if: matrix.dockerfile == 'Dockerfile.server'
        uses: actions/download-artifact@v4
        with:
          name: agent-x86_64
          path: agents/x86_64/
      - name: Download agent-aarch64
        if: matrix.dockerfile == 'Dockerfile.server'
        uses: actions/download-artifact@v4
        with:
          name: agent-aarch64
          path: agents/aarch64/
      - name: Prepare agent binaries
        if: matrix.dockerfile == 'Dockerfile.server'
        run: |
          mv agents/x86_64/agent agents/agent-x86_64
          mv agents/aarch64/agent agents/agent-aarch64
          rm -rf agents/x86_64 agents/aarch64
          chmod +x agents/agent-*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          build-args: |
            SERVER_VERSION=${{ needs.version.outputs.version }}
            AGENT_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}-${{ matrix.platform }}
          platforms: ${{ matrix.platform }}

  manifest:
    name: Multi-Arch Manifest (${{ matrix.image }})
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [assimilate, assimilate-agent]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha
      - name: Create and push manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

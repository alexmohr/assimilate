name: Release
on:
  push:
    tags: ["v*"]
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading "v" from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Dockerfile.server bundles prebuilt agent binaries from agents/, so they must
  # be built for every architecture before the server image.
  build-agent:
    name: Build Agent
    needs: [version]
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Release Docker Publish
    needs: [version, build-agent]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      server-version: ${{ needs.version.outputs.version }}
      agent-version: ${{ needs.version.outputs.version }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
        type=sha

  publish-demo:
    name: Release Demo Image Publish
    needs: [version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-demo-image.yml
    with:
      tags: |
        type=semver,pattern={{version}}
        type=raw,value=latest
        type=sha

  desktop:
    name: Build Desktop
    needs: [version]
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # The GitHub release appears only once every part of it is built and
  # published: the container images, the agent binaries and the desktop
  # installers. A tag pushed without a release gets one.
  release:
    name: GitHub Release
    needs: [version, build-agent, publish, desktop]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ github.ref_name }}
      agent-version: ${{ needs.version.outputs.version }}
      image-tag: ${{ needs.version.outputs.version }}
